name: voicebridge_ai
description: VoiceBridge AI - Real-time AI voice call translator.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1

  # Auth / Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # WebRTC & media
  flutter_webrtc: ^0.11.6
  permission_handler: ^11.3.1
  record: ^5.1.2
  audioplayers: ^6.1.0

  # OAuth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # Payments
  razorpay_flutter: ^1.3.7
  flutter_stripe: ^11.1.0

  # UI helpers
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0

  # Utility
  intl: ^0.19.0
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
