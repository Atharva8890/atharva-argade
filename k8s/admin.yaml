apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: voicebridge
spec:
  replicas: 2
  selector:
    matchLabels: { app: admin }
  template:
    metadata:
      labels: { app: admin }
    spec:
      containers:
        - name: admin
          image: ghcr.io/your-org/voicebridge-admin:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.voicebridge.ai
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: voicebridge
spec:
  selector: { app: admin }
  ports:
    - port: 80
      targetPort: 3000
